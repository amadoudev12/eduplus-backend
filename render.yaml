# Configuration du backend EduPlus sur Render (le frontend est dans un autre dépôt, hébergé sur Vercel)
services:
  - type: web
    name: eduplus-backend
    runtime: node
    plan: free
    buildCommand: npm install
    # « npm start » applique d'abord les migrations (prisma migrate deploy), puis lance le serveur
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render choisit lui-même une longue valeur aléatoire
      - key: JWT_SECRET
        generateValue: true
      # À remplir à la main dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
      # Connexion directe pour les migrations (sur Supabase : le pooler en mode session, port 5432)
      - key: DIRECT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
