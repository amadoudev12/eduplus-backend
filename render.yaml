# Configuration du backend EduPlus sur Render (le frontend est dans un autre dépôt, hébergé sur Vercel)
services:
  - type: web
    name: eduplus-backend
    runtime: node
    plan: free
    # Les migrations créent ou mettent à jour les tables à chaque déploiement
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render choisit lui-même une longue valeur aléatoire
      - key: JWT_SECRET
        generateValue: true
      # À remplir à la main dans le tableau de bord Render
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
